# Static analysis configuration.
#
# Lint rule set: very_good_analysis (a strict, opinionated superset of
# flutter_lints used by Very Good Ventures). It catches a much wider range of
# real bugs and style issues than the default `flutter_lints` package.
#
# Adding it to an existing codebase always surfaces lots of pre-existing
# warnings. To avoid breaking the build all at once, the `analyzer.errors`
# block below demotes the noisiest rules from `warning` to `info` so they
# show up as suggestions in the IDE without failing `flutter analyze`. As we
# clean things up we can promote each one back to `warning` (or remove the
# override entirely to inherit the strict default).

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "lib/generated_plugin_registrant.dart"

  errors:
    # Style preferences — demoted to info so they don't break CI.
    public_member_api_docs: ignore
    lines_longer_than_80_chars: ignore
    document_ignores: ignore
    avoid_redundant_argument_values: info
    use_setters_to_change_properties: info
    cascade_invocations: info
    sort_constructors_first: info
    sort_unnamed_constructors_first: info
    avoid_classes_with_only_static_members: info
    one_member_abstracts: info
    prefer_int_literals: info
    avoid_positional_boolean_parameters: info
    flutter_style_todos: info
    require_trailing_commas: info
    diagnostic_describe_all_properties: ignore
    avoid_dynamic_calls: info
    avoid_setters_without_getters: info

linter:
  rules:
    # Project-specific overrides go here. Empty for now — we inherit the
    # full very_good_analysis rule set.
