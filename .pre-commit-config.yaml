# Pre-commit hooks. Install once with:
#   pip install pre-commit
#   pre-commit install
#
# Then `git commit` will automatically run these on staged files. Run them on
# the whole repo on demand with: `pre-commit run --all-files`.

repos:
  # ── Generic hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1500']
      - id: detect-private-key

  # ── Backend (Python) — ruff lint + format ────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix, --config=ppulse_backend/pyproject.toml]
        files: ^ppulse_backend/.*\.py$
      - id: ruff-format
        args: [--config=ppulse_backend/pyproject.toml]
        files: ^ppulse_backend/.*\.py$

  # ── Backend (Python) — bandit security scan ──────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-c', 'ppulse_backend/pyproject.toml', '-q']
        files: ^ppulse_backend/.*\.py$
        additional_dependencies: ['bandit[toml]']

  # ── Frontend (Dart) — format + analyze ───────────────────────────────────
  # `dart format` is a system hook because pre-commit doesn't host a dart repo.
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        files: \.dart$
        pass_filenames: true
      # Only fail on real errors (undefined methods, type mismatches, missing
      # imports). Infos and warnings are reported but don't block commits,
      # since the WIP codebase carries a large pre-existing lint baseline.
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze --no-fatal-warnings --no-fatal-infos
        language: system
        files: \.dart$
        pass_filenames: false
        require_serial: true
